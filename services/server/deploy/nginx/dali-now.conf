# ============================================================
# 大理此刻 (DaLiNow) - Nginx 完整配置
# ============================================================
# 部署到服务器: /etc/nginx/conf.d/dali-now.conf
# 测试配置:     nginx -t
# 重载配置:     systemctl reload nginx
#
# 使用前替换:
#   域名                -> 替换为你的域名（搜索 your-domain.com）
#   YOUR_SERVER_IP      -> 你的服务器公网 IP
#   证书路径            -> /etc/nginx/cert/<你的域名>.pem / .key
#
# 架构说明:
#   HTTPS (443) - 主入口，阿里云 SSL 证书部署在 Nginx
#   HTTP  (80)- 保留，用于直连 IP 访问和兼容
# ============================================================

# -------------------- 上游服务定义 --------------------
upstream dali_api {
    server 127.0.0.1:3000;           # Node.js Express 公开 API
    keepalive 64;
}

upstream dali_admin_api {
    server 127.0.0.1:5000;           # Python Flask 管理后台 API
    keepalive 16;
}

# -------------------- Gzip 压缩 --------------------
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/x-javascript
    image/svg+xml
    font/woff
    font/woff2;

# -------------------- 限流区（登录防暴力破解） --------------------
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

# ============================================================
# HTTPS 主站 (443) - 主要入口
# ============================================================
server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # ---- SSL 证书（从阿里云下载的 .pem 和 .key） ----
    ssl_certificate     /etc/nginx/cert/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/cert/your-domain.com.key;

    # ---- SSL 安全配置 ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- 安全头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- 基础参数 ----
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # ---- 日志 ----
    access_log /var/log/nginx/dali-now-https-access.log;
    error_log  /var/log/nginx/dali-now-https-error.log;

    # ============================================================
    # Location 路由
    # ============================================================

    # ====== [1] 管理后台前端 ======
    location /admin/ {
        alias /data/www/admin/;
        try_files $uri $uri/ /admin/index.html;
        index index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /admin/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # ====== [2] 管理后台登录接口（限流） ======
    location = /api/admin/login {
        limit_req zone=admin_login burst=3 nodelay;
        proxy_pass http://dali_admin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ====== [3] 管理后台 API ======
    location /api/admin/ {
        proxy_pass http://dali_admin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ====== [3.5] 图片上传 ======
    location /api/upload/ {
        proxy_pass http://dali_admin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 20M;
    }

    # ====== [4] 公开 API ======
    location /api/ {
        proxy_pass http://dali_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ====== [5] 用户上传图片 ======
    location /uploads/ {
        alias /data/dali-now/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";

        location ~* \.(php|py|sh|pl|cgi)$ {
            deny all;
        }
    }

    # ====== [6] 系统图片 ======
    location /images/ {
        alias /data/dali-now/services/server/images/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ====== [7] 健康检查 ======
    location = /api/health {
        proxy_pass http://dali_api;
        access_log off;
        proxy_read_timeout 5s;
    }

    # ====== [8] 首页 ======
    location = / {
        return 200 '大理此刻 API 服务运行中';
        add_header Content-Type text/plain;
    }

    # ====== [9] 禁止隐藏文件 ======
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ====== [10] favicon ======
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =204;
    }
}

# ============================================================
# HTTP (80) - 保留 HTTP 访问
# ============================================================
server {
    listen 80;
    server_name your-domain.com YOUR_SERVER_IP localhost;

    client_max_body_size 20M;
    client_body_buffer_size 128k;

    access_log /var/log/nginx/dali-now-http-access.log;
    error_log  /var/log/nginx/dali-now-http-error.log;

    # ====== [1] 管理后台前端 ======
